<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>돼지탈출</title>
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#17201d;--ink2:#55625d;--muted:#8a9590;--line:#e2e7e4;--pri:#1f6f5c;--pri2:#e3f1ec;--warn:#b5651d;--bad:#a33;}
@media (prefers-color-scheme:dark){:root{--bg:#101513;--card:#1a211e;--ink:#e8eeeb;--ink2:#a9b5b0;--muted:#76827d;--line:#2a3330;--pri:#4fb398;--pri2:#1d322b;}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:84px;-webkit-tap-highlight-color:transparent}
header{padding:18px 18px 6px}
header h1{margin:0;font-size:22px}
header .sub{color:var(--ink2);font-size:14px;margin-top:4px}
main{padding:6px 14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:10px 0;border:1px solid var(--line)}
.card h2{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted);font-size:13px}
.ink2{color:var(--ink2)}
button,.btn{font:inherit;border:0;border-radius:12px;padding:11px 14px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:var(--pri2);color:var(--pri)}
button.small{padding:7px 10px;font-size:13px;border-radius:10px}
button.danger{background:transparent;color:var(--bad);padding:4px 6px}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:64px}
label{display:block;font-size:13px;color:var(--ink2);margin:8px 0 4px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.done{color:var(--pri);font-weight:700}
.big{font-size:20px;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;color:var(--muted);border-radius:0;padding:12px 0 14px;font-size:13px;font-weight:600}
nav button.on{color:var(--pri)}
nav span{display:block;font-size:20px;margin-bottom:2px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{aspect-ratio:1;border-radius:12px;background:var(--bg);border:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--ink2);overflow:hidden;position:relative;cursor:pointer}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot b{position:relative;background:rgba(0,0,0,.55);color:#fff;padding:2px 6px;border-radius:6px;font-weight:600}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.rings div{background:var(--bg);border-radius:12px;padding:10px 4px}
.rings b{display:block;font-size:18px}
.scale{display:flex;gap:6px}
.scale button{flex:1;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:9px 0}
.scale button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.step:last-child{border:0}
.step .dot{width:26px;height:26px;border-radius:50%;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.step.ok .dot{background:var(--pri);color:#fff;border-color:var(--pri)}
.step.next{background:var(--pri2);margin:0 -16px;padding:12px 16px}
.list-item{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.list-item img{width:52px;height:52px;object-fit:cover;border-radius:8px}
.list-item .grow{flex:1;min-width:0}
.daytitle{font-weight:700;margin:16px 4px 4px;color:var(--ink2)}
.badday{background:#fff4e8;border-color:#f0d3b0}
@media (prefers-color-scheme:dark){.badday{background:#2b2218;border-color:#4a3a28}}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:var(--pri2);color:var(--pri);font-weight:600}
dialog{border:0;border-radius:18px;padding:18px;width:min(94vw,440px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.cam{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
.cam.on{display:flex}
.cam .view{position:relative;flex:1;overflow:hidden}
.cam video,.cam .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .ghost{opacity:.35;pointer-events:none}
.cam .count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:96px;color:#fff;font-weight:800;text-shadow:0 2px 12px #000}
.cam .bar{display:flex;gap:8px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#000}
.cam .bar button{flex:1}
.compare{position:relative;width:100%;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--bg)}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare .after{clip-path:inset(0 0 0 50%)}
.compare .lbl{position:absolute;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px}
svg text{font-family:inherit}
.hide{display:none!important}
.ai{background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:6px;font-size:13px}
.copybox{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:10px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1 id="hTitle">오늘</h1>
  <div class="sub" id="hSub"></div>
</header>
<main id="main"></main>

<nav id="nav">
  <button data-tab="today" class="on"><span>☀️</span>오늘</button>

<div class="cam" id="cam">

    <img class="ghost hide" id="camGhost" alt="">

  </div>

    <button class="ghost" id="camClose">닫기</button>
    <button class="ghost" id="camFlip">카메라 전환</button>
    <button id="camShot">5초 뒤 찍기</button>
  </div>
</div>

<dialog id="dlg"></dialog>

<script>
// ===== 저장소 =====
const DB_NAME = 'pigescape', STORE = 'entries';
let dbp;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(mode, fn) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(STORE, mode), s = t.objectStore(STORE);
    const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
  });
}
const put = e => tx('readwrite', s => s.put(e));
const del = id => tx('readwrite', s => s.delete(id));
const all = () => tx('readonly', s => s.getAll());

let ENTRIES = [];
async function reload() { ENTRIES = (await all()).sort((a, b) => b.ts - a.ts); }

const SKEY = 'pigescape-settings';
const S = Object.assign({
  apiKey: '', startDate: '', goalWeight: 75, proteinTarget: 120, ladder: {}, badDay: '', coachMsg: '', focus: 'en', book: { title: '', total: 0, page: 0 }, bedAt: 0
}, JSON.parse(localStorage.getItem(SKEY) || '{}'));
function saveS() { localStorage.setItem(SKEY, JSON.stringify(S)); }

// ===== 날짜 =====
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
if (!S.startDate) { S.startDate = today(); saveS(); }
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
function parseD(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function mondayOf(s) { const d = parseD(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ymd(d); }
function weekNo() { return Math.floor((parseD(today()) - parseD(S.startDate)) / 86400000 / 7) + 1; }
function fmtDay(s) { const d = parseD(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// ===== 루틴 =====
const STRENGTH = {
  A: '맨몸 근력 A — 벽/무릎 푸시업 3×8, 의자 스쿼트 3×10, 글루트 브릿지 3×12, 플랭크 3×20초',
  B: '맨몸 근력 B — 지지 런지 3×8(한쪽), 인클라인 푸시업 3×8, 버드독 3×10, 사이드 플랭크 3×15초'
};
// 요일(0=일) → 계획
const PHASES = [
  { name: '1단계 · 기초 체력', until: 4, plan: {
    1: ['walk', '빠른 걷기 30분'], 2: ['strength', STRENGTH.A], 3: ['walk', '빠른 걷기 30분'],
    4: ['strength', STRENGTH.B], 5: ['walk', '빠른 걷기 30분'], 6: ['dojo', '도장 사다리 다음 칸 + 걷기 20분'],
    0: ['rest', '쉬는 날 — 가벼운 산책이면 충분']}},
  { name: '2단계 · 도장 적응', until: 12, plan: {
    1: ['dojo', '도장·테니스·축구 중 하나 (또는 사다리 다음 칸)'], 2: ['strength', STRENGTH.A], 3: ['walk', '빠른 걷기 40분'],
    4: ['dojo', '도장·테니스·축구 중 하나 (또는 사다리 다음 칸)'], 5: ['strength', STRENGTH.B], 6: ['walk', '등산·걷기·슬로우조깅 중 40분'],
    0: ['rest', '쉬는 날']}},
  { name: '3단계 · 퍼포먼스', until: 9999, plan: {
    1: ['dojo', '도장'], 2: ['strength', STRENGTH.A], 3: ['dojo', '도장'],
    4: ['walk', '회복 걷기 40분'], 5: ['dojo', '도장'], 6: ['strength', STRENGTH.B],
    0: ['rest', '쉬는 날']}}
];
const phase = () => PHASES.find(p => weekNo() <= p.until);
const WTYPE = { walk: '걷기', slowjog: '슬로우조깅', jog: '조깅', hike: '등산', gym: '헬스', strength: '맨몸 근력', dojo: 'MMA 도장', tennis: '테니스', soccer: '축구', other: '기타', rest: '휴식' };
const WPICK = ['walk', 'slowjog', 'jog', 'hike', 'gym', 'strength', 'dojo', 'tennis', 'soccer', 'other'];
const RPE = { 1: '가볍게', 2: '적당히', 3: '힘들게' };
const noteLabel = t => t === 'dojo' ? '오늘 배운 기술 (예: 잽-크로스, 더블레그)' : (t === 'tennis' || t === 'soccer') ? '오늘 한 것 (예: 포핸드 랠리, 패스 연습)' : t === 'gym' ? '한 운동 (예: 레그프레스, 랫풀다운)' : '메모';

const LADDER = [
  ['MMA 기초 수업 영상 1개 보기', '유튜브에서 "MMA 초보 첫 수업" 정도로 검색. 10분이면 끝.'],
  ['도장 앞까지 걸어가 보기', '안 들어가도 됨. 걷기 운동으로 기록하면 된다.'],
  ['도장에 문자 보내기', '아래 "관장님께 보낼 문자"를 복사해서 보낸다. 답장을 받는 것까지가 이번 칸.'],
  ['수업 구경만 하기 (10~20분)', '운동복 필요 없음. "구경 왔어요" 한마디면 된다.'],
  ['체험 수업 1회 — 목표는 "들어가기"', '끝까지 따라가지 않아도 성공. 힘들면 벽에 기대 쉬어도 된다.'],
  ['2주 동안 주 1회', '요일·시간을 하나 고정. 전날 밤 가방을 현관에 둔다.'],
  ['주 2회', '여기까지 오면 루틴이 된 것.']
];
const DEFAULT_MSG = '안녕하세요, 성인 초보 MMA 수업 문의드립니다.\n운동을 오래 쉬었고 체중이 많이 나가서 조금 긴장되는데요, 처음 오는 사람이 참여하기 좋은 시간대가 언제인지, 수업을 먼저 구경해도 되는지 여쭤봐도 될까요?';

// ===== 삶 쌓기 =====
const GROW = {
  en: { name: '영어', icon: '🇺🇸', min: '10분', how: '말문 앱으로 회화 문장 연습', link: 'https://actor0211.github.io/malmun/' },
  ja: { name: '일본어', icon: '🇯🇵', min: '10분', how: '히라가나 → 가타카나 → 기초 회화 순서로' },
  book: { name: '책', icon: '📖', min: '10쪽', how: '자기 전 10쪽, 폰은 다른 방에' }
};
const JA_ROAD = ['히라가나 46자 (2주)', '가타카나 46자 (2주)', '기초 인사·자기소개 (2주)', '기초 문법 です/ます (4주)', '쉬운 회화 문장 반복'];

// ===== 공통 =====
const $ = s => document.querySelector(s);
const main = $('#main');
let TAB = 'today';
const byDate = (d, kind) => ENTRIES.filter(e => e.date === d && (!kind || e.kind === kind));
function inWeek(e) { return e.date >= mondayOf(today()) && e.date <= today(); }
function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#17201d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:90vw';
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function openDlg(html, bind) {
  const d = $('#dlg'); d.innerHTML = html; d.showModal();
  d.querySelectorAll('[data-close]').forEach(b => b.onclick = () => d.close());
  bind && bind(d);
}
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
  ({ today: renderToday, body: renderBody, dojo: renderDojo, log: renderLog, set: renderSet })[TAB]();
}
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) { TAB = b.dataset.tab; render(); scrollTo(0, 0); } };

// ===== 사진 =====
function resizeImage(src, max = 1024, q = 0.8) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = rej;
    img.src = src;
  });
}
function pickPhoto() {
  return new Promise(res => {
    const f = $('#filePick'); f.value = '';
    f.onchange = () => {
      const file = f.files[0]; if (!file) return res(null);
      const url = URL.createObjectURL(file);
      resizeImage(url, 900, 0.8).then(d => { URL.revokeObjectURL(url); res(d); });
    };
    f.click();
  });
}

// ===== AI 식사 분석 =====
const MEAL_SCHEMA = {
  type: 'object',
  properties: {
    items: { type: 'array', items: { type: 'object', properties: { name: { type: 'string' }, amount: { type: 'string' } }, required: ['name', 'amount'], additionalProperties: false } },
    kcal: { type: 'integer' },
    protein_g: { type: 'integer' },
    comment: { type: 'string' }
  },
  required: ['items', 'kcal', 'protein_g', 'comment'],
  additionalProperties: false
};
const MEAL_SYSTEM = '너는 한국 음식에 밝은 영양 코치다. 사진 속 음식을 보고 음식 이름과 대략의 양, 전체 칼로리(kcal)와 단백질(g)을 추정한다. 정확한 측정이 아니라 방향을 잡기 위한 추정이며, 애매하면 한국 일반 1인분 기준으로 잡는다. comment는 한국어 한 문장으로, 단백질을 더 채우거나 다음 끼니를 조정하는 실용적인 제안을 한다. 비난하거나 죄책감을 주는 말은 하지 않는다. 음식이 아닌 사진이면 items를 비우고 kcal·protein_g를 0으로, comment에 음식 사진이 아니라고 적는다.';
let sdkP;
async function analyzeMeal(dataUrl) {
  if (!S.apiKey) throw new Error('설정에서 API 키를 먼저 넣어 주세요.');
  if (!sdkP) sdkP = import('https://esm.sh/@anthropic-ai/sdk');
  const { default: Anthropic } = await sdkP;
  const client = new Anthropic({ apiKey: S.apiKey, dangerouslyAllowBrowser: true });
  const content = [
    { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: dataUrl.split(',')[1] } },
    { type: 'text', text: '이 식사를 분석해 줘.' }
  ];
  const base = { model: 'claude-opus-5-5', max_tokens: 4000, system: MEAL_SYSTEM, messages: [{ role: 'user', content }] };
  let res;
  try {
    res = await client.beta.messages.create({
      ...base,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'low', format: { type: 'json_schema', schema: MEAL_SCHEMA } }
    });
  } catch (err) {
    if (err?.status !== 400) throw err;
    // 일부 옵션이 거부되면 기본 형태로 한 번 더
    res = await client.messages.create({ ...base, system: MEAL_SYSTEM + ' 답은 JSON 객체 하나로만: {"items":[{"name","amount"}],"kcal","protein_g","comment"}' });
  }
  if (res.stop_reason === 'refusal') throw new Error('AI가 이 사진 분석을 거절했어요. 직접 입력해 주세요.');
  const text = res.content.filter(b => b.type === 'text').map(b => b.text).join('');
  const m = text.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('분석 결과를 읽지 못했어요.');
  return JSON.parse(m[0]);
}

async function addMeal(slot) {
  const img = await pickPhoto(); if (!img) return;
  const e = { id: uid(), kind: 'meal', date: today(), ts: Date.now(), slot, img, kcal: null, protein: null };
  await put(e); await reload(); render();
  if (S.apiKey) runMealAI(e);
}
async function runMealAI(e) {
  toast('AI가 식사를 보는 중…');
  try {
    const r = await analyzeMeal(e.img);
    e.ai = r; e.kcal = r.kcal; e.protein = r.protein_g;
    await put(e); await reload(); render();
    toast(`약 ${r.kcal}kcal · 단백질 ${r.protein_g}g`);
  } catch (err) {
    toast('분석 실패: ' + (err.message || err));
  }
}
function editMeal(e) {

  const date = ymd(new Date(wake)), old = ENTRIES.find(e => e.kind === 'sleep' && e.date === date && e.source === 'manual');
  await put({ id: old?.id || uid(), kind: 'sleep', date, ts: wake, bed, wake, hours, source: 'manual' });
  S.bedAt = 0; saveS(); await reload(); render();
  toast(`${hours}시간 잤어요${hours >= 7 ? ' 👍' : ''}`);

async function hcSync(days = 3, loud = false) {

    for (const [date, hourly] of Object.entries(per))

function weightChart(bodies) {
  const wk = {};
  bodies.forEach(b => { const k = mondayOf(b.date); (wk[k] = wk[k] || []).push(b.weight); });
  const pts = Object.keys(wk).sort().map(k => ({ k, v: wk[k].reduce((a, b) => a + b, 0) / wk[k].length, n: wk[k].length }));
  if (!pts.length) return '<div class="muted">체중을 기록하면 여기에 주별 평균 선이 그려져요.</div>';
  const W = 340, H = 170, L = 34, R = 12, T = 14, B = 26;
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi - lo < 2) { const c = (hi + lo) / 2; lo = c - 1; hi = c + 1; }
  lo = Math.floor(lo); hi = Math.ceil(hi);
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const ticks = [lo, (lo + hi) / 2, hi];
  const lbl = k => { const d = parseD(k); return `${d.getMonth() + 1}/${d.getDate()}`; };
  const every = Math.ceil(pts.length / 5);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="체중 주간 평균 그래프">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${t.toFixed(t % 1 ? 1 : 0)}</text>`).join('')}
    ${pts.length > 1 ? `<polyline fill="none" stroke="var(--pri)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map((p, i) => `${x(i)},${y(p.v)}`).join(' ')}"/>` : ''}
    ${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="var(--pri)" stroke="var(--card)" stroke-width="2"/>
      <circle class="hit" data-i="${i}" cx="${x(i)}" cy="${y(p.v)}" r="16" fill="transparent"/>
      ${i % every === 0 || i === pts.length - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${lbl(p.k)}</text>` : ''}`).join('')}
    <g id="tip" class="hide"><rect rx="6" height="22" fill="var(--ink)"/><text font-size="12" fill="var(--card)"></text></g>
  </svg>
  <script type="application/json" id="chartData">${JSON.stringify(pts.map((p, i) => ({ x: x(i), y: y(p.v), t: `${lbl(p.k)} 주 · ${p.v.toFixed(1)}kg (${p.n}회)` })))}<\/script>`;
}
function bindChart() {
  const svg = main.querySelector('#chart svg'); if (!svg) return;
  const data = JSON.parse(main.querySelector('#chartData').textContent);
  const tip = svg.querySelector('#tip'), txt = tip.querySelector('text'), rect = tip.querySelector('rect');
  const show = i => {
    const d = data[i]; txt.textContent = d.t; tip.classList.remove('hide');
    const w = txt.getComputedTextLength() + 14;
    const tx = Math.max(2, Math.min(340 - w - 2, d.x - w / 2)), ty = d.y < 40 ? d.y + 12 : d.y - 32;
    rect.setAttribute('x', tx); rect.setAttribute('y', ty); rect.setAttribute('width', w);
    txt.setAttribute('x', tx + 7); txt.setAttribute('y', ty + 15);
  };
  svg.querySelectorAll('.hit').forEach(h => { h.onpointerenter = h.onclick = () => show(+h.dataset.i); });
  svg.onpointerleave = () => tip.classList.add('hide');
}

let camStream = null, camFacing = 'user', camPose = 'front';
async function openCam(pose, prev) {
  camPose = pose;
  const g = $('#camGhost');
  if (prev) { g.src = prev.img; g.classList.remove('hide'); } else g.classList.add('hide');
  $('#cam').classList.add('on');
  await startCam();
}
async function startCam() {
  stopCam(true);
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: camFacing, width: { ideal: 1080 }, height: { ideal: 1440 } }, audio: false });
    $('#camVideo').srcObject = camStream;
    $('#camVideo').style.transform = camFacing === 'user' ? 'scaleX(-1)' : '';
    $('#camGhost').style.transform = '';
  } catch (e) {
    toast('카메라를 열 수 없어요. "사진첩에서 고르기"를 써 주세요.');
    closeCam();
  }
}
function stopCam(keep) { if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; if (!keep) $('#camVideo').srcObject = null; }
function closeCam() { stopCam(); $('#cam').classList.remove('on'); }
$('#camClose').onclick = closeCam;
$('#camFlip').onclick = () => { camFacing = camFacing === 'user' ? 'environment' : 'user'; startCam(); };
$('#camShot').onclick = () => {

  const iv = setInterval(async () => {
    n--; if (n > 0) { c.textContent = n; return; }
    clearInterval(iv); c.classList.add('hide'); $('#camShot').disabled = false;
    const v = $('#camVideo'), cv = document.createElement('canvas');
    // 화면 비율(3:4)로 가운데를 잘라 저장 → 다음 촬영 때 겹쳐 보기와 맞도록
    const vw = v.videoWidth, vh = v.videoHeight, ar = 3 / 4;
    let sw = vw, sh = vw / ar; if (sh > vh) { sh = vh; sw = vh * ar; }
    cv.width = 900; cv.height = 1200;
    const ctx = cv.getContext('2d');
    if (camFacing === 'user') { ctx.translate(cv.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(v, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, cv.width, cv.height);
    await put({ id: uid(), kind: 'photo', date: today(), ts: Date.now(), pose: camPose, img: cv.toDataURL('image/jpeg', 0.82) });
    await reload(); closeCam(); render(); toast('찍었어요');
  }, 1000);
};

    <h2>한 칸씩</h2>
    <div class="muted" style="margin-bottom:6px">두 번 등록하고 못 간 건 의지 문제가 아니라, "등록"과 "첫 입장" 사이 간격이 너무 컸던 거예요. 그 사이를 잘게 쪼갰어요. 하루에 한 칸이면 충분해요.</div>
    ${LADDER.map(([t, d], i) => `<div class="step ${S.ladder[i] ? 'ok' : ''} ${i === next ? 'next' : ''}">
      <div class="dot">${S.ladder[i] ? '✓' : i + 1}</div>
      <div style="flex:1"><b>${esc(t)}</b><div class="muted">${esc(d)}${S.ladder[i] ? ` · ${S.ladder[i]} 완료` : ''}</div></div>
      ${i === next ? `<button class="small" data-step="${i}">했어요</button>` : S.ladder[i] && i === next - 1 || (next < 0 && i === LADDER.length - 1) ? `<button class="small ghost" data-undo="${i}">취소</button>` : ''}
    </div>`).join('')}
  </div>

  <div class="card">
    <h2>관장님께 보낼 문자</h2>
    <div class="copybox" id="msgBox">${esc(S.coachMsg || DEFAULT_MSG)}</div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="msgEdit">고치기</button><button id="msgCopy">복사</button></div>
    <div class="muted" style="margin-top:8px">관장님들은 이런 문의를 매주 받아요. 처음 오는 성인은 대부분 비슷한 상태로 시작해요.</div>
  </div>

  <div class="card">
    <h2>🥋 기술 노트 <span class="muted">${notes.length}회</span></h2>
    ${notes.length ? notes.map(n => `<div class="list-item"><div class="grow"><b>${fmtDay(n.date)}</b> · ${n.min}분<div class="ink2">${esc(n.note || '(메모 없음)')}</div></div></div>`).join('') : '<div class="muted">도장 운동을 기록할 때 배운 기술을 적으면 여기 쌓여요. 다음 수업 전에 훑어보세요.</div>'}
    <button class="ghost" id="dojoLog" style="margin-top:10px;width:100%">도장 다녀왔어요</button>
  </div>`;
  main.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { S.ladder[b.dataset.step] = today(); saveS(); render(); toast('한 칸 올라갔어요 🎉'); });
  main.querySelectorAll('[data-undo]').forEach(b => b.onclick = () => { delete S.ladder[b.dataset.undo]; saveS(); render(); });
  $('#msgCopy').onclick = async () => { try { await navigator.clipboard.writeText(S.coachMsg || DEFAULT_MSG); toast('복사했어요'); } catch { toast('복사가 안 돼요. 길게 눌러 복사해 주세요'); } };
  $('#msgEdit').onclick = () => openDlg(`<h3 style="margin-top:0">문자 고치기</h3><textarea id="mE" style="min-height:160px">${esc(S.coachMsg || DEFAULT_MSG)}</textarea>
    <div class="row" style="margin-top:10px"><button class="ghost" data-close>취소</button><button id="mES">저장</button></div>`,
    d => d.querySelector('#mES').onclick = () => { S.coachMsg = d.querySelector('#mE').value; saveS(); d.close(); render(); });
  $('#dojoLog').onclick = () => logWorkout('dojo', 60);
}

// ===== 기록 =====
function renderLog() {
  $('#hTitle').textContent = '기록';
  $('#hSub').textContent = `지금까지 ${ENTRIES.length}개`;
  const groups = {};
  ENTRIES.forEach(e => (groups[e.date] = groups[e.date] || []).push(e));
  const line = e => {
    if (e.kind === 'workout') return `💪 ${WTYPE[e.type]} ${e.min}분${e.note ? ' · ' + esc(e.note) : ''}`;
    if (e.kind === 'meal') return `🍚 ${e.slot}${e.kcal ? ` · ${e.kcal}kcal` : ''}${e.protein ? ` · 단백질 ${e.protein}g` : ''}${e.late ? ' · 야식' : ''}`;
    if (e.kind === 'mood') return `🧠 기분 ${e.mood} · 에너지 ${e.energy} · 스트레스 ${e.stress}${e.sleep != null ? ` · 잠 ${e.sleep}h` : ''}${e.text ? ' · ' + esc(e.text) : ''}`;
    if (e.kind === 'body') return `⚖️ ${e.weight}kg${e.fat ? ` · 체지방 ${e.fat}%` : ''}${e.muscle ? ` · 근육 ${e.muscle}kg` : ''}`;
    if (e.kind === 'grow') return `${GROW[e.area].icon} ${GROW[e.area].name} ${e.pages != null ? e.pages + '쪽' : e.min + '분'}${e.note ? ' · ' + esc(e.note) : ''}`;
    if (e.kind === 'activity') return `🚶 걸음 ${e.steps.toLocaleString()}보 · 자동`;
    if (e.kind === 'sleep') return `😴 잠 ${hm(e.bed)} → ${hm(e.wake)} · ${e.hours}시간`;
    if (e.kind === 'photo') return `📸 눈바디 (${{ front: '정면', side: '측면', back: '후면' }[e.pose]})`;
    return e.kind;
  };
  main.innerHTML = Object.keys(groups).length ? Object.keys(groups).sort().reverse().map(d => `
    <div class="daytitle">${fmtDay(d)}</div>
    <div class="card" style="margin-top:4px;padding:4px 16px">
      ${groups[d].map(e => `<div class="list-item">${e.img ? `<img src="${e.img}">` : ''}<div class="grow">${line(e)}</div>${e.source === 'hc' || e.source === 'watch' ? '<span class="muted">자동</span>' : `<button class="danger" data-del="${e.id}">지우기</button>`}</div>`).join('')}
    </div>`).join('') : '<div class="card muted">아직 기록이 없어요. 오늘 탭에서 시작해요.</div>';
  main.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('이 기록을 지울까요? 되돌릴 수 없어요.')) return;
    await del(b.dataset.del); await reload(); render();
  });
}

// ===== 설정 =====
function renderSet() {
  $('#hTitle').textContent = '설정';
  $('#hSub').textContent = '이 앱의 기록은 이 폰 안에만 저장돼요.';
  main.innerHTML = `
  <div class="card">
    <h2>목표</h2>
    <div class="row">
      <div><label>목표 체중(kg)</label><input id="sG" type="number" inputmode="decimal" value="${S.goalWeight}"></div>
      <div><label>하루 단백질(g)</label><input id="sP" type="number" inputmode="numeric" value="${S.proteinTarget}"></div>
    </div>
    <div class="muted" style="margin-top:6px">단백질은 목표 체중 × 1.6g 정도가 기본이에요. <button class="small ghost" id="sCalc">계산해서 넣기</button></div>
    <label>이번 달 주력 (삶 쌓기)</label>
    <select id="sF">${Object.entries(GROW).map(([k, g]) => `<option value="${k}" ${S.focus === k ? 'selected' : ''}>${g.name}</option>`).join('')}</select>
    <label>시작일 (주차·단계 계산 기준)</label><input id="sD" type="date" value="${S.startDate}">
    <button id="sSave" style="width:100%;margin-top:12px">저장</button>
  </div>

  <div class="card">
    <h2>AI 식사 분석</h2>
    <label>Claude API 키</label>
    <input id="sK" type="password" value="${esc(S.apiKey)}" placeholder="sk-ant-..." autocomplete="off">
    <div class="muted" style="margin-top:6px">키는 이 폰에만 저장되고, 사진 분석할 때 Anthropic으로만 보내져요. 사진 한 장에 약 20~30원 정도예요 (추정).</div>
    <button id="sKSave" style="width:100%;margin-top:10px">키 저장</button>
  </div>

  <div class="card">
    <h2>백업</h2>
    <div class="muted">기록이 폰 안에만 있어서, 폰을 바꾸거나 브라우저 데이터를 지우면 사라져요. 한 달에 한 번 백업 파일을 받아 두세요.</div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="sExp">백업 파일 받기</button><button class="ghost" id="sImp">백업 불러오기</button></div>
    <input type="file" id="impFile" accept="application/json" class="hide">
  </div>

  <div class="card">
    <h2>워치·인바디 자동 연동</h2>
    ${NATIVE ? `<div class="ink2">${hcStatusText()}</div>
      <div class="row" style="margin-top:10px"><button id="hcAsk2">${HC.all ? '권한 다시 보기' : '연결하기'}</button><button class="ghost" id="hcSync">지금 가져오기</button></div>
      <button class="ghost small" id="hcSet" style="margin-top:8px">Health Connect 설정 열기</button>
      <div class="muted" style="margin-top:8px">삼성 헬스 → 설정 → Health Connect 에서 걸음·운동·수면·체중 공유를 켜 두어야 들어와요.</div>`
    : `<div class="muted">갤럭시워치·인바디가 삼성 헬스에 기록한 걸음·운동·잠·체중을 자동으로 가져오려면 <b>안드로이드 앱 버전</b>이 필요해요. (웹앱은 건강 데이터를 읽을 수 없어요)</div>
      <a class="btn" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="${APK_URL}">안드로이드 앱 받기</a>
      <div class="muted" style="margin-top:8px">설치 후엔 그 앱만 쓰세요. 지금 기록은 "백업 파일 받기" → 앱에서 "백업 불러오기"로 옮길 수 있어요.</div>`}
  </div>
  <div class="muted" style="text-align:center;margin:16px 0">돼지탈출 v0.2</div>`;

  if (NATIVE) { $('#hcAsk2').onclick = hcAsk; $('#hcSync').onclick = () => hcSync(14, true); $('#hcSet').onclick = () => HB.openSettings().catch(e => toast(e.message)); }
  $('#sCalc').onclick = () => { $('#sP').value = Math.round((+$('#sG').value || 75) * 1.6); };
  $('#sSave').onclick = () => { S.goalWeight = +$('#sG').value || 75; S.proteinTarget = +$('#sP').value || 120; S.startDate = $('#sD').value || S.startDate; S.focus = $('#sF').value; saveS(); toast('저장했어요'); };
  $('#sKSave').onclick = () => { S.apiKey = $('#sK').value.trim(); saveS(); toast(S.apiKey ? '키를 저장했어요' : '키를 지웠어요'); };
  $('#sExp').onclick = () => {
    const blob = new Blob([JSON.stringify({ app: 'pigescape', v: 1, at: new Date().toISOString(), settings: { ...S, apiKey: '' }, entries: ENTRIES })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `돼지탈출-백업-${today()}.json`; a.click();
  };
  $('#sImp').onclick = () => $('#impFile').click();
  $('#impFile').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (data.app !== 'pigescape') throw new Error('돼지탈출 백업 파일이 아니에요');
      if (!confirm(`기록 ${data.entries.length}개를 불러올까요? 같은 기록은 덮어쓰고, 지금 있는 다른 기록은 그대로 둬요.`)) return;
      for (const e of data.entries) await put(e);
      const key = S.apiKey; Object.assign(S, data.settings, { apiKey: key }); saveS();
      await reload(); render(); toast('불러왔어요');
    } catch (err) { toast('불러오기 실패: ' + err.message); }
  };
}

// ===== 시작 =====
(async () => {
  await reload(); render();
  if (NATIVE) {
    hcSync(HC.lastSync ? 3 : 14);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - HC.lastSync > 5 * 60000) hcSync(2); });
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
